<!DOCTYPE html>
<html lang="en" data-theme="light" data-layout="split">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mermaid Diagram Editor</title>
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/editor.css">
  <link rel="stylesheet" href="/styles/preview.css">
  <link rel="stylesheet" href="/styles/themes.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="header-left">
        <h1>Mermaid Editor</h1>
      </div>
      <div class="header-right">
        <button id="new-from-template" class="btn btn-secondary">Templates</button>
        <button id="theme-toggle" class="btn btn-icon">🌙</button>
      </div>
    </header>

    <div id="tab-bar" class="tab-bar"></div>

    <main class="main-content">
      <div class="editor-panel">
        <div class="panel-header">
          <span>Editor</span>
          <button id="layout-toggle-editor" class="btn btn-icon">⛶</button>
        </div>
        <div id="editor-container" class="editor-container"></div>
      </div>

      <div class="preview-panel">
        <div class="panel-header">
          <span>Preview</span>
          <button id="layout-toggle-preview" class="btn btn-icon">⛶</button>
        </div>
        <div id="preview-container" class="preview-container"></div>
        <div class="export-buttons">
          <button id="export-png" class="btn btn-success">Export PNG</button>
          <button id="export-svg" class="btn btn-success">Export SVG</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Export Options Dialog -->
  <div id="export-dialog" class="export-dialog" style="display: none;">
    <div class="export-dialog-overlay"></div>
    <div class="export-dialog-content">
      <h2>Export Options</h2>

      <div class="export-option-group">
        <label>Format:</label>
        <div class="export-format-selection">
          <span id="export-format-display">PNG</span>
        </div>
      </div>

      <div class="export-option-group">
        <label for="export-scale">Scale:</label>
        <select id="export-scale" class="export-select">
          <option value="1">1x (Original)</option>
          <option value="2" selected>2x (Recommended)</option>
          <option value="3">3x (High Quality)</option>
          <option value="4">4x (Very High)</option>
        </select>
      </div>

      <div class="export-option-group">
        <label for="export-width">Width (px):</label>
        <input type="number" id="export-width" class="export-input" placeholder="Auto">
      </div>

      <div class="export-option-group">
        <label for="export-height">Height (px):</label>
        <input type="number" id="export-height" class="export-input" placeholder="Auto">
      </div>

      <div class="export-preview-section">
        <h3>Preview</h3>
        <div id="export-preview-container" class="export-preview-container">
          <div class="export-preview-loading">Generating preview...</div>
        </div>
      </div>

      <div class="export-dialog-actions">
        <button id="export-cancel" class="btn btn-secondary">Cancel</button>
        <button id="export-confirm" class="btn btn-success">Download</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { init } from '/scripts/app.js';
    init();
  </script>
</body>
</html>
